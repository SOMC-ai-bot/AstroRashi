<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="refresh" content="1; url=http://localhost:3000">
  <title>AstroNex — Specialist AI Astrologer</title>
  <style>
    :root {
      --bg-dark: #0A0A0C;
      --card-bg: #141418;
      --accent-plum: #8B2F55;
      --accent-rose: #C24E78;
      --gold-primary: #D8C58A;
      --text-primary: #FFFFFF;
      --text-muted: #8E8E93;
    }
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
    }
    body {
      background: radial-gradient(circle at 50% 20%, #1A0D18 0%, #0A0A0C 70%);
      color: var(--text-primary);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .launcher-card {
      background: rgba(20, 20, 24, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 24px;
      padding: 40px 32px;
      max-width: 480px;
      width: 100%;
      text-align: center;
      box-shadow: 0 24px 60px rgba(0, 0, 0, 0.8), 0 0 40px rgba(139, 47, 85, 0.2);
    }
    .orb {
      width: 68px;
      height: 68px;
      margin: 0 auto 20px;
      border-radius: 50%;
      background: radial-gradient(circle at 35% 35%, #D8C58A, #C24E78 50%, #8B2F55 90%);
      box-shadow: 0 0 35px rgba(194, 78, 120, 0.55);
      animation: pulse 2.5s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); opacity: 0.95; }
      50% { transform: scale(1.06); opacity: 1; filter: drop-shadow(0 0 16px rgba(216, 197, 138, 0.7)); }
    }
    h1 {
      font-size: 26px;
      font-weight: 700;
      letter-spacing: -0.5px;
      margin-bottom: 8px;
      background: linear-gradient(135deg, #FFFFFF 30%, #D8C58A 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      font-size: 13.5px;
      color: var(--text-muted);
      line-height: 1.5;
      margin-bottom: 24px;
    }
    .status-badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 999px;
      background: rgba(39, 174, 96, 0.15);
      border: 1px solid rgba(39, 174, 96, 0.35);
      color: #2ECC71;
      font-size: 12.5px;
      font-weight: 600;
      margin-bottom: 28px;
    }
    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: #2ECC71;
      box-shadow: 0 0 8px #2ECC71;
    }
    .btn-launch {
      display: block;
      width: 100%;
      padding: 14px 20px;
      border-radius: 14px;
      font-size: 15px;
      font-weight: 600;
      color: #FFFFFF;
      background: linear-gradient(135deg, var(--accent-plum) 0%, var(--accent-rose) 100%);
      border: none;
      text-decoration: none;
      cursor: pointer;
      box-shadow: 0 8px 24px rgba(194, 78, 120, 0.4);
      transition: all 0.2s ease;
    }
    .btn-launch:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 30px rgba(194, 78, 120, 0.55);
    }
    .note {
      font-size: 12px;
      color: var(--text-muted);
      margin-top: 20px;
    }
    .note a {
      color: var(--gold-primary);
      text-decoration: none;
    }
    .note a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>

  <div class="launcher-card">
    <div class="orb"></div>
    <h1>AstroNex</h1>
    <p class="subtitle">Specialist AI Astrologer & Vedic Platform<br>Offline-First Precision Astrology</p>

    <div class="status-badge">
      <div class="status-dot"></div>
      <span>Local Dev Server Running on Port 3000</span>
    </div>

    <a href="http://localhost:3000" class="btn-launch" id="launchBtn">
      Open AstroNex App →
    </a>

    <p class="note">
      Opening <a href="http://localhost:3000">http://localhost:3000</a> automatically...<br>
      Click the button above if your browser did not redirect.
    </p>
  </div>

  <script>
    // Automatically redirect browser to local server
    setTimeout(function() {
      window.location.href = "http://localhost:3000";
    }, 400);
  </script>

</body>
</html>
